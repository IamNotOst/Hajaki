<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hajaki · сутність</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0a12;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 1.5rem;
            position: relative;
            color: #eaeaea;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(circle at 20% 30%, rgba(108, 92, 231, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255, 137, 6, 0.18) 0%, transparent 45%),
                radial-gradient(circle at 40% 80%, rgba(162, 155, 254, 0.12) 0%, transparent 40%),
                #0b0a12;
            animation: breath 8s ease-in-out infinite alternate;
        }

        @keyframes breath {
            0% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        .card {
            position: relative;
            z-index: 2;
            max-width: 780px;
            width: 100%;
            background: rgba(15, 14, 28, 0.68);
            backdrop-filter: blur(14px) saturate(1.2);
            -webkit-backdrop-filter: blur(14px) saturate(1.2);
            border-radius: 3rem 1rem 3rem 1rem;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 137, 6, 0.08) inset;
            padding: 2.8rem 2.5rem;
            transition: all 0.3s ease;
        }

        .card:hover {
            border-color: rgba(255, 137, 6, 0.2);
            box-shadow: 0 40px 90px rgba(108, 92, 231, 0.15), 0 0 0 1px rgba(255, 137, 6, 0.15) inset;
        }

        .glitch-title {
            font-size: clamp(2.8rem, 12vw, 4.8rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.1;
            background: linear-gradient(130deg, #c4b5fd, #ff8906, #a78bfa);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradShift 6s ease infinite alternate;
            text-shadow: 0 0 30px rgba(255, 137, 6, 0.15);
            margin-bottom: 0.2rem;
        }

        @keyframes gradShift {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }

        .sub {
            display: block;
            font-size: 1rem;
            font-weight: 300;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.35);
            margin-top: -0.2rem;
            margin-bottom: 2.2rem;
            border-left: 3px solid #ff8906;
            padding-left: 1.2rem;
        }

        .sub span {
            color: #ff8906;
            font-weight: 400;
        }

        .mystic-text {
            font-size: 1.25rem;
            line-height: 1.8;
            font-weight: 300;
            color: rgba(220, 220, 240, 0.85);
            border-left: 2px solid rgba(108, 92, 231, 0.3);
            padding-left: 1.5rem;
            margin: 2rem 0 2.5rem 0;
            font-style: italic;
            letter-spacing: 0.02em;
        }

        .mystic-text strong {
            color: #ff8906;
            font-weight: 500;
            font-style: normal;
        }

        .grid-badge {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem 1.2rem;
            margin: 2rem 0 1.2rem 0;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }

        .badge {
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.02);
            padding: 0.4rem 1rem;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: 0.25s ease;
        }

        .badge:hover {
            background: rgba(255, 137, 6, 0.06);
            border-color: rgba(255, 137, 6, 0.2);
            color: #fff;
            transform: scale(1.02);
        }

        .badge i {
            margin-right: 0.4rem;
            color: #a78bfa;
        }

        .signature {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            margin-top: 2.8rem;
            padding-top: 1.8rem;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.25);
        }

        .signature a {
            color: rgba(255, 255, 255, 0.35);
            text-decoration: none;
            border-bottom: 1px dashed rgba(255, 137, 6, 0.15);
            transition: 0.2s;
        }

        .signature a:hover {
            color: #ff8906;
            border-color: #ff8906;
        }

        .pulse-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #ff8906;
            border-radius: 50%;
            margin-right: 0.6rem;
            animation: pulse 2s ease-in-out infinite;
            box-shadow: 0 0 12px #ff890655;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .veil {
            display: inline-block;
            position: relative;
            cursor: default;
        }

        .veil::after {
            content: '⏤⏤⏤';
            letter-spacing: 0.2em;
            position: absolute;
            left: 0;
            bottom: -0.2rem;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ff890655, transparent);
            opacity: 0.3;
        }

        @media (max-width: 550px) {
            .card { padding: 2rem 1.5rem; }
            .mystic-text { font-size: 1rem; padding-left: 1rem; }
            .sub { font-size: 0.75rem; letter-spacing: 0.2em; }
            .badge { font-size: 0.6rem; padding: 0.3rem 0.8rem; }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="card">

        <h1 class="glitch-title">
            Hajaki
            <span style="display: inline-block; font-size: 0.45em; vertical-align: middle; margin-left: 0.2rem; color: rgba(255,255,255,0.1);">†</span>
        </h1>
        <div class="sub">
            <span>Денис</span> · сутність, що залишається
        </div>

        <div class="mystic-text">
            <span class="pulse-dot"></span>
            колись тут було <strong>50 причин</strong> полюбити Hajaki.<br>
            але ця сторінка <strong>зникла</strong> з волі її творця.
        </div>

        <div class="grid-badge">
            <span class="badge"><i class="fa-regular fa-compass"></i> 0x7F</span>
            <span class="badge"><i class="fa-regular fa-star"></i> невидиме</span>
            <span class="badge"><i class="fa-regular fa-moon"></i> тиша</span>
            <span class="badge"><i class="fa-regular fa-hand-peace"></i> 50 → ∅</span>
            <span class="badge"><i class="fa-regular fa-eye-slash"></i> приховано</span>
            <span class="badge"><i class="fa-regular fa-heart"></i> залишок</span>
        </div>

        <div class="signature">
            <span>
                <i class="fa-regular fa-circle" style="color: #ff8906; opacity: 0.5; margin-right: 0.3rem;"></i>
                <span class="veil">архів Hajaki</span>
            </span>
            <span>
                <i class="fa-regular fa-code" style="margin-right: 0.3rem;"></i>
                <a href="#">розробник · 2026</a>
            </span>
        </div>

        <div style="margin-top: 1.2rem; font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255,255,255,0.07); border-top: 1px dashed rgba(255,255,255,0.02); padding-top: 1.2rem; text-align: center;">
            <i class="fa-regular fa-ghost"></i> коли-небудь тут знову з'являться причини · але не сьогодні
        </div>

    </div>

    <script>
        (function() {
            const card = document.querySelector('.card');
            let mouseX = 0, mouseY = 0;
            let currentX = 0, currentY = 0;

            document.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                mouseX = (e.clientX - centerX) / 40;
                mouseY = (e.clientY - centerY) / 40;
            });

            function animateShadow() {
                currentX += (mouseX - currentX) * 0.06;
                currentY += (mouseY - currentY) * 0.06;
                card.style.boxShadow = `
                    0 30px 80px rgba(0,0,0,0.8),
                    0 0 0 1px rgba(255,137,6,0.08) inset,
                    ${currentX * 2}px ${currentY * 2}px 40px rgba(108,92,231,0.08)
                `;
                requestAnimationFrame(animateShadow);
            }
            animateShadow();

            const title = document.querySelector('.glitch-title');
            setInterval(() => {
                if (Math.random() > 0.92) {
                    title.style.transform = `translate(${(Math.random()-0.5)*2}px, ${(Math.random()-0.5)*2}px)`;
                    setTimeout(() => { title.style.transform = ''; }, 80);
                }
            }, 300);
        })();
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>50 причин полюбити Hajaki (Дениса) 🔥</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6c5ce7;
            --secondary: #a29bfe;
            --dark: #0f0e17;
            --light: #f9f9f9;
            --accent: #ff8906;
            --text: #e4e4e4;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--dark);
            color: var(--text);
            line-height: 1.7;
            overflow-x: hidden;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 3rem;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-size: 3.5rem;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.2);
            animation: fadeIn 1s ease-out;
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.8;
            margin-bottom: 2rem;
            animation: fadeIn 1s 0.3s ease-out both;
        }

        /* Reasons List */
        .reasons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .reason-card {
            background: rgba(15, 14, 23, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1.5rem;
            transition: var(--transition);
            backdrop-filter: blur(10px);
            transform: translateY(20px);
            opacity: 0;
            animation: fadeInUp 0.6s forwards;
            box-shadow: var(--shadow);
        }

        .reason-card:hover {
            transform: translateY(-5px) !important;
            border-color: var(--accent);
            box-shadow: 0 15px 35px rgba(255, 137, 6, 0.2);
        }

        .reason-card strong {
            color: var(--accent);
            font-weight: 600;
        }

        /* Particles Background */
        #particles-js {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        /* Footer */
        footer {
            text-align: center;
            margin-top: 4rem;
            padding: 2rem;
            opacity: 0.7;
            font-size: 0.9rem;
        }

        .heart {
            color: #ff4757;
            animation: pulse 1.5s infinite;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }
            .reasons-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="particles-js"></div>
    
    <div class="container">
        <header>
            <h1>50 причин полюбити Hajaki</h1>
            <p class="subtitle">Денис – справжній друг, який вартий того, щоб його цінували!</p>
        </header>

        <div class="reasons-grid" id="reasonsList">
            <!-- Reasons will be loaded via JS -->
        </div>

        <footer>
            <p>Створено з <span class="heart">❤</span> для Hajaki (Дениса) | 2025</p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        // Reasons Data
        const reasons = [
            "Верний друг – завжди підтримає в скрутну хвилину.",
            "Надійний – на нього можна покластися.",
            "Чесний – говорить прямо, без фальші.",
            "Добрий – готовий допомогти без зайвих питань.",
            "Веселий – з ним ніколи не нудно.",
            "Чуття гумору – його жарти піднімають настрій.",
            "Відкритий – легко знаходить спільну мову з людьми.",
            "Преданний – не зрадить і не підведе.",
            "Цікавий співрозмовник – з ним можна говорити годинами.",
            "Мудрий – дає хороші поради.",
            "Оптиміст – заряджає позитивом.",
            "Сміливий – не боїться труднощів.",
            "Творчий – у нього нестандартне мислення.",
            "Щедрий – ділиться тим, що має.",
            "Співчутливий – розуміє емоції інших.",
            "Терплячий – вміє слухати.",
            "Енергійний – з ним хочеться діяти.",
            "Скромний – не вихваляється своїми достоїнствами.",
            "Надійний – якщо пообіцяв, то зробить.",
            "Любить пригоди – з ним завжди цікаво.",
            "Гарний смак у музиці – знає, що порекомендувати.",
            "Відповідальний – підходить до справ серйозно.",
            "Романтичний – вміє зробити приємний жест.",
            "Темпераментний – у ньому є вогонь.",
            "Доброзичливий – бачить у людях хороше.",
            "Не злопам’ятний – не тримає образи.",
            "Цілеспрямований – йде до своєї мети.",
            "Готовий до змін – не боїться нового.",
            "Гарний друг для тварин – любить братів менших.",
            "Вміння мотивувати – надихає на досягнення.",
            "Тактовний – знає, коли промовчати.",
            "Гарний смак у кіно – обере цікавий фільм.",
            "Не егоїст – думає про інших.",
            "Легкий на підйом – завжди готовий до пригод.",
            "Вірний своїм принципам – має характер.",
            "Кмітливий – знаходить вихід з будь-якої ситуації.",
            "Допитливий – цікавиться світом.",
            "Гарний організатор – вміє збирати компанію.",
            "Небайдужий – переживає за близьких.",
            "Має гарний почерк (якщо так 😄).",
            "Впевнений у собі – але не зарозумілий.",
            "Вміє готувати (або хоча б старається).",
            "Душевний – з ним тепло на серці.",
            "Не боїться бути собою – автентичний.",
            "Має гарні життєві цінності.",
            "Поважає чужу думку – навіть якщо не згоден.",
            "Вміє пробачати – не зберігає зла.",
            "Завжди в руслі – йде в ногу з часом.",
            "Наділений харизмою – притягує до себе людей.",
            "Він просто чудовий! – тому його варто любити!"
        ];

        // Render Reasons with Staggered Animation
        const reasonsList = document.getElementById('reasonsList');
        
        reasons.forEach((reason, index) => {
            const card = document.createElement('div');
            card.className = 'reason-card';
            card.innerHTML = `<strong>${index + 1}.</strong> ${reason}`;
            card.style.animationDelay = `${index * 0.1}s`;
            reasonsList.appendChild(card);
        });

        // Particles.js Config
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 80, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": "#6c5ce7" },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.5, "random": true },
                "size": { "value": 3, "random": true },
                "line_linked": { "enable": true, "distance": 150, "color": "#a29bfe", "opacity": 0.4, "width": 1 },
                "move": { "enable": true, "speed": 2, "direction": "none", "random": true, "straight": false, "out_mode": "out" }
            },
            "interactivity": {
                "detect_on": "canvas",
                "events": {
                    "onhover": { "enable": true, "mode": "repulse" },
                    "onclick": { "enable": true, "mode": "push" },
                    "resize": true
                },
                "modes": {
                    "repulse": { "distance": 100, "duration": 0.4 },
                    "push": { "particles_nb": 4 }
                }
            },
            "retina_detect": true
        });

        // Scroll Animation
        const cards = document.querySelectorAll('.reason-card');
        
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = 1;
                    entry.target.style.transform = 'translateY(0)';
                }
            });
        }, { threshold: 0.1 });

        cards.forEach(card => observer.observe(card));
    </script>
</body>
</html>

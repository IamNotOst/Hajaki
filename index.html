<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=yes"><title>скрыто</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;font-family:'Courier New',Courier,monospace;padding:1.5rem}.hidden-message{color:#fff;font-size:clamp(0.9rem,2.5vw,1.2rem);letter-spacing:.03em;word-spacing:.1em;line-height:1.6;text-align:center;max-width:520px;width:100%;padding:1.8rem 1.2rem;transition:all .5s cubic-bezier(.23,1,.32,1);opacity:0;transform:translateY(8px);animation:gentleRise 1.8s ease-out forwards;cursor:default;user-select:none;-webkit-user-select:none}.hidden-message.revealed{opacity:1;transform:translateY(0)}.hidden-message:hover{color:#e0e0e0;letter-spacing:.06em;word-spacing:.13em;transition:all .4s ease;text-shadow:0 0 8px rgba(200,200,200,.3)}@keyframes gentleRise{0%{opacity:0;transform:translateY(12px);filter:blur(1px)}30%{opacity:.2;filter:blur(.6px)}100%{opacity:1;transform:translateY(0);filter:blur(0)}}.hidden-message p{margin:0;word-break:break-word;font-weight:400}@media(max-width:500px){.hidden-message{padding:1.4rem .9rem;letter-spacing:.02em}}</style></head><body><div class="hidden-message" id="msg"><p>Когда-то здесь было 50 причин полюбить Hajaki,<br>но сейчас эта страница скрыта её разработчиком.</p></div><script>(function(){const e=document.getElementById('msg');function r(){e&&e.classList.add('revealed')}document.readyState==='loading'?document.addEventListener('DOMContentLoaded',r):r();e&&(e.addEventListener('mouseenter',function(){this.style.transition='all .35s ease-out'}),e.addEventListener('mouseleave',function(){this.style.transition='all .5s cubic-bezier(.23,1,.32,1)'}),e.addEventListener('touchstart',function(e){e.stopPropagation()},{passive:!0}))})()</script></body></html>
